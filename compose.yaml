# Containerized ETL + viz stack (issues #13/#15/#28/#8).
#
#   db        PostGIS server; created fresh from the image on first `up`. The
#             image entrypoint enables the PostGIS extension in the default
#             database (POSTGRES_DB), so no extra DDL is needed.
#             imresamu/postgis is a multi-arch (amd64 + arm64) rebuild of the
#             official postgis/postgis images, so the database runs natively on
#             Apple Silicon instead of x86 emulation (postgis/postgis is
#             amd64-only). Same PostGIS behaviour, same postgres entrypoint.
#             On a fresh db volume, docker/viz_reader.sql runs from
#             /docker-entrypoint-initdb.d to provision the read-only
#             `viz_reader` role the viz service connects as.
#             PostGIS is NOT published to the host: the server stack keeps the
#             database internal to the compose network (issue #8) — nginx is
#             the only externally reachable surface.
#
#   pipeline  the `python -m etl` CLI in a container running the server
#             startup path (issue #8): `python -m etl startup` bootstraps the
#             database preconditions, checks the fixed S3 keys, applies the
#             current Boundary releases, enqueues the current Source object
#             versions, and only then starts the ingestion worker. A fatal
#             Boundary condition exits non-zero before the worker starts, so
#             the restart policy crash-loops until the operator fixes it.
#             The worker reads its input from S3/SQS/SNS, so this container
#             mounts NO data volume — the private source-data seed volume
#             stays off the server stack. Connection settings and AWS
#             coordinates come from the environment (DATABASE_URL, S3_BUCKET,
#             SQS_QUEUE_URL, SNS_TOPIC_ARN), supplied by the operator's
#             shell/.env; nothing data- or secret-like is baked into the image
#             or this file.
#
#   viz       the Streamlit + PyDeck app in its own container, always running
#             (no auth). It reads the marts/core/service tables through the
#             read-only `viz_reader` role via VIZ_DATABASE_URL from the
#             environment (the app reads it with a DATABASE_URL fallback,
#             viz/data.py). This (server) variant publishes no app port —
#             nginx is the only externally reachable surface.
#
#   nginx     the single external entry point on the server: reverse-proxies
#             the viz container (nginx.conf → http://viz:8501, with websocket
#             upgrade headers for Streamlit's live runtime) so Streamlit never
#             needs its own published port. Edit `docker/nginx.conf` and the
#             `nginx` service here to pin hostname/TLS if you serve from a real
#             domain.
#
# Images: the pipeline and viz containers are pulled from Docker Hub
# (`khvostenko/aws-energy-etl`, `khvostenko/aws-energy-viz`, both `latest` by default;
# `${PIPELINE_IMAGE}` / `${VIZ_IMAGE}` override to pin another tag or registry).
# The build-from-source twin of this file — the same stack that compiles both
# images from this repo — is `build_compose.yaml`.
#
# The local-dev twin of this file, `local_compose.yaml`, keeps the private
# source-data seed volume (`etl_data`, external: the seed script,
# scripts/seed_data_volume.sh, creates it once per machine) mounted at
# /app/data and the `run-all` CLI workflow — that is the local workflow, not
# the server deployment.
#
# db credentials: POSTGRES_* here and the DATABASE_URL the operator supplies
# are a coupled pair — change both if you deviate. The viz_reader password
# follows suit: it is hard-coded in docker/viz_reader.sql and supplied as
# VIZ_DATABASE_URL — change both. See docs/containerization.md.

name: energy-de-etl

services:
  db:
    # Multi-arch (arm64 + amd64): native on Apple Silicon, no emulation.
    # alpine variant keeps the image small.
    image: imresamu/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-etl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etl}
      POSTGRES_DB: ${POSTGRES_DB:-energy_de}
    restart: always
    # No ports: PostGIS stays internal to the compose network (issue #8) —
    # the pipeline and viz reach it as `db:5432`, and nothing is published
    # to the host. `docker compose exec db psql` still works without a
    # published port.
    volumes:
      - db_data:/var/lib/postgresql/data
      # Provision the read-only viz_reader role on a fresh db volume. A
      # single-file mount (not a directory) keeps the image's own
      # /docker-entrypoint-initdb.d PostGIS bootstrap scripts visible; the
      # `99-` prefix runs this after them. Idempotent (docker/viz_reader.sql).
      - ./docker/viz_reader.sql:/docker-entrypoint-initdb.d/99-viz-reader.sql:ro
    healthcheck:
      # Force TCP: the postgres image runs a temporary socket-only init server
      # (listen_addresses='') to apply the PostGIS extension scripts before
      # restarting as the real server. A socket-checking pg_isready goes green
      # during init, so the pipeline would start into the restart window; over
      # TCP it stays unhealthy until the real listener is accepting.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-etl} -d ${POSTGRES_DB:-energy_de}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  pipeline:
    image: ${PIPELINE_IMAGE:-khvostenko/aws-energy-etl:latest}
    # The server startup path (issue #8): explicit bootstrap — database
    # preconditions, fixed S3 key checks, current Boundary releases, current
    # Source object versions enqueued — then the ingestion worker. A fatal
    # Boundary condition exits non-zero before the worker starts.
    command: ["python", "-m", "etl", "startup"]
    environment:
      # Required, no defaults: the server stack fails fast without them
      # rather than starting a worker that cannot reach its input.
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL (the pipeline role's PostGIS URL)}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET (the versioned data bucket)}
      SQS_QUEUE_URL: ${SQS_QUEUE_URL:?set SQS_QUEUE_URL (the S3 ObjectCreated queue)}
      SNS_TOPIC_ARN: ${SNS_TOPIC_ARN:?set SNS_TOPIC_ARN (worker, blocked-startup and DLQ alerts)}
      # boto3 resolves a region from the environment first. Without it the
      # worker would fall back to the instance metadata service, which the
      # container cannot count on reaching, and fail to build its clients.
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:?set AWS_DEFAULT_REGION (the deployment region)}
    restart: always
    # No volumes: the worker reads S3 through the event queue, so the private
    # source-data seed volume is not mounted here (issue #8).
    depends_on:
      db:
        condition: service_healthy

  viz:
    image: ${VIZ_IMAGE:-khvostenko/aws-energy-viz:latest}
    restart: always
    # "streamlit run viz/app.py --server.headless --server.address
    # 0.0.0.0 --server.port 8501" is the image's default command; nothing to
    # override here. VIZ_DATABASE_URL comes from the environment (the app
    # reads it with a DATABASE_URL fallback, viz/data.py).
    environment:
      VIZ_DATABASE_URL: ${VIZ_DATABASE_URL:?set VIZ_DATABASE_URL (the read-only viz_reader URL)}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Streamlit's own health probe; python supplies urllib out of the box
      # (the slim image ships no curl). GET /_stcore/health -> 200 "ok".
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  nginx:
    # Single externally-published entry point: port 80 → viz:8501.
    image: nginx:stable-alpine
    restart: always
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      # Conf.d drop-in: the image's default /etc/nginx/conf.d/default.conf is
      # replaced wholesale by our server block.
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      viz:
        condition: service_healthy
    healthcheck:
      # nginx:stable-alpine ships wget. Probe the proxied root through nginx
      # itself, proving the whole entry path (nginx → viz) is healthy.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/_stcore/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  db_data:
